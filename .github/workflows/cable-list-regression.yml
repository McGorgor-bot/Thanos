name: Cable list regression checks

on:
  push:
    branches:
      - simplify-cable-list-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cable-list-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Smoke-test cable list import and XLSX export
        run: |
          python - <<'PY'
          import io
          import pandas as pd
          from thanos.cable_list import CABLE_COLUMNS, export_cable_list_xlsx, import_cable_list_table

          row = {column: "" for column in CABLE_COLUMNS}
          row.update({
              "Oznaczenie obwodu": "TEST-WL-01",
              "Rozdzielnica źródłowa": "RG",
              "Odbiornik / rozdzielnica docelowa": "TP1",
              "Typ kabla": "YKY 5x10",
              "Liczba równoległych kabli": 1,
              "Długość [m]": 12.5,
              "Status weryfikacji": "Do weryfikacji",
          })
          source = pd.DataFrame([row], columns=CABLE_COLUMNS)
          xlsx = export_cable_list_xlsx(source)
          assert isinstance(xlsx, (bytes, bytearray)) and len(xlsx) > 100
          imported = import_cable_list_table(xlsx, "smoke-test.xlsx")
          assert len(imported) == 1, f"Expected one row, got {len(imported)}"
          assert str(imported.iloc[0]["Oznaczenie obwodu"]) == "TEST-WL-01"
          assert str(imported.iloc[0]["Typ kabla"]) == "YKY 5x10"
          print("PASS: cable list XLSX export/import round-trip")
          PY
      - name: Smoke-test CSV export format
        run: |
          python - <<'PY'
          import pandas as pd
          from thanos.cable_list import CABLE_COLUMNS
          row = {column: "" for column in CABLE_COLUMNS}
          row["Oznaczenie obwodu"] = "TEST-WL-CSV"
          csv_bytes = pd.DataFrame([row], columns=CABLE_COLUMNS).to_csv(
              index=False, sep=";", encoding="utf-8-sig", lineterminator="\\n"
          ).encode("utf-8-sig")
          assert csv_bytes.startswith(b"\\xef\\xbb\\xbf")
          text = csv_bytes.decode("utf-8-sig")
          assert ";" in text.splitlines()[0]
          assert "TEST-WL-CSV" in text
          print("PASS: semicolon CSV export encoding and content")
          PY
